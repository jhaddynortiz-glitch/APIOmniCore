name: Deploy Backend to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jhaddyn/api-omnicore:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull jhaddyn/api-omnicore:latest
            docker stop api-omnicore || true
            docker rm api-omnicore || true
            # Comando para correr el contenedor con tus variables (ajusta si faltan)
            docker run -d --name api-omnicore \
              -p 3000:3000 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/uploads:/app/public/uploads \
              --restart always \
              jhaddyn/api-omnicore:latest
